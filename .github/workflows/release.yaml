name: Release
# Tag vX.Y.Z -> a GitHub release with static linux binaries (amd64, arm64) and SHA256SUMS, and the same binaries as a scratch image
# registry.kmnet.uk/vmd1:<tag> (and :latest), which the tunnel-agent provisioning script pulls onto servers (pull account: agent-pull).
# Needs the repository secrets REGISTRY_USERNAME / REGISTRY_PASSWORD (a registry-admin account).
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/vmd1_linux_$arch ./cmd/vmd1
          done
          (cd dist && sha256sum vmd1_linux_* > SHA256SUMS)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.kmnet.uk
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          provenance: false
          push: true
          tags: |
            registry.kmnet.uk/vmd1:${{ github.ref_name }}
            registry.kmnet.uk/vmd1:latest
